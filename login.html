<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIAMAG Dishub Ponorogo</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="login-page">
    <div class="card login-card">
        <div class="card-body">
            <!-- Logo & Judul -->
            <div class="text-center mb-4">
                <img src="assets/img/Logo.png" alt="Logo Dishub Ponorogo" class="login-logo mb-3">
                <h5 class="login-title">SIAMAG</h5>
                <p class="login-subtitle mb-0">Sistem Absensi Magang</p>
                <p class="login-subtitle">Dinas Perhubungan Kab. Ponorogo</p>
            </div>

            <!-- Alert error (hidden default) -->
            <div class="alert alert-danger d-none" id="alertError" role="alert">
                <i class="fas fa-exclamation-circle me-1"></i>
                <span id="alertMsg"></span>
            </div>

            <!-- Form Login -->
            <form id="formLogin" autocomplete="off">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" 
                           placeholder="NISN / KODE KAMPUS+NIM / NIP" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="position-relative">
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="Masukkan password" required>
                        <button type="button" class="toggle-password" onclick="togglePass()">
                            <i class="fas fa-eye" id="iconEye"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">
                            Ingat saya
                        </label>
                    </div>
                    <a href="#" class="login-forgot">Lupa password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-login w-100" id="btnLogin">
                    Masuk
                </button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <div class="position-absolute bottom-0 start-0 end-0 text-center pb-3 login-footer">
        &copy; 2026 Dinas Perhubungan Kabupaten Ponorogo
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/js/masterData.js"></script>
<!-- Login JS -->
<script src="assets/js/login.js"></script>

</body>
</html>
